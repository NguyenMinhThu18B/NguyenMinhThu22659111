<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="../bootstrap-5.2.3-dist/css/bootstrap.min.css">
    <script src="../bootstrap-5.2.3-dist/js/bootstrap.min.js"></script>
    <script src="../bootstrap-5.2.3-dist/js/jquery-3.6.0.min.js"></script>
    <style>
        input {
            width: 300px !important;
        }
        
        label {
            text-align: right;
        }
        
        span {
            display: block;
            color: red;
        }
    </style>
</head>

<body>
    <div class="containerr" style="padding-inline: 70px">
        <div class="row">
            <a href="Home.html"><img src="../img/LOGOBT.png" alt="" style="width: 10%;"></a>
        </div>
        <div class="wrapper" style="margin-top: 40px">

            <div class="row">
                <div class="col-12 col-md-7">
                    <div class="box" style="box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); padding: 20px">
                        <h1 class="text-center" style="font-size: 50px; font-weight: 900">
                            Contact us
                        </h1>
                        <h4 class="text-center">
                            <i>Bạn có bất kỳ câu hỏi nào cho chúng tôi ?</i>
                        </h4>
                        <div class="row">
                            <label class="col-4" for="">Họ và tên:</label>
                            <div class="col-8">
                                <input onblur="ckHo()" id="ho" type="text" placeholder="VD: Nguyễn Minh Thư" />
                                <span id="mgho"></span>
                            </div>
                        </div>
                        <br />
                        <div class="row">
                            <label class="col-4" for="">Số điện thoại:</label>
                            <div class="col-8">
                                <input onblur="ckPhone()" id="phone" type="text" placeholder="VD: 0388XXXXXXX" />
                                <span id="mgphone"></span>
                            </div>
                        </div>
                        <br />
                        <div class="row">
                            <label class="col-4" for="">Email:</label>
                            <div class="col-8">
                                <input onblur="ckEmail()" id="email" type="email" placeholder="VD: minhthu@gmail.com" />
                                <span id="mgemail"></span>
                            </div>
                        </div>
                        <br />
                        <div class="row">
                            <label class="col-4" for="">Lời nhắn:</label>
                            <div class="col-8">
                                <textarea onblur="ckTin()" id="tinnhan" name="" id="" cols="3" rows="10" style="width: 300px; height: 100px" placeholder="Cảm ơn vì đã chọn T-CANDY!"></textarea>
                                <span id="mgtinnhan"></span>
                            </div>
                        </div>
                        <br />

                        <button type="submit" id="btn_send" class="btn btn-success" style="
                    width: 120px;
                    display: inline;
                    margin: auto;
                    height: 50px;
                    font-size: 20px;
                    line-height: 40px;
                    font-weight: 600;
                    margin-left: 260px;
                  ">
              Gửi
            </button>
                        <a href="GioiThieu.html" style="text-decoration: none;">
                            <button class="btn btn-success" style="
                width: 120px;
                display: inline;
                margin: auto;
                height: 50px;
                font-size: 20px;
                line-height: 40px;
                font-weight: 600;">
                Quay lại
              </button>
                        </a>


                    </div>
                </div>
            </div>


        </div>
    </div>
    <script>
        function ckHo() {
            const value = document.getElementById("ho").value;
            let rg = /^([A-Z]{1}[a-z]*)(\s[A-Z]{1}[a-z]*)*(\s[A-Z]{1}[a-z]*)$/;
            if (!rg.test(value)) {
                document.getElementById("mgho").innerHTML =
                    "Họ tên: Phải có ít nhất Họ, Tên. Ký tự đầu bắt buộc phải viết hoa";
                return false;
            } else {
                document.getElementById("mgho").innerHTML = "";
                return true;
            }
        }

        function ckPhone() {
            const value = document.getElementById("phone").value;
            let rg = /^(09||03||07||06||05||04)[0-9]{8}$/;
            if (!rg.test(value)) {
                document.getElementById("mgphone").innerHTML =
                    "Điện thoại phải là số điện thoại 10 ký tự số, bắt đầu là 09, 03, 07, 06, 05, 04 !";
                return false;
            } else {
                document.getElementById("mgphone").innerHTML = "";
                return true;
            }
        }

        function ckEmail() {
            const value = document.getElementById("email").value;
            let rg = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
            if (!rg.test(value)) {
                document.getElementById("mgemail").innerHTML = "Email không hợp lệ !";
                return false;
            } else {
                document.getElementById("mgemail").innerHTML = "";
                return true;
            }
        }

        function ckTin() {
            const value = document.getElementById("tinnhan").value;
            if (value == "") {
                document.getElementById("mgtinnhan").innerHTML =
                    "Nội dung không để rỗng !";
                return false;
            } else {
                document.getElementById("mgtinnhan").innerHTML = "";
                return true;
            }
        }

        document.getElementById("btn_send").addEventListener("click", (e) => {
            e.preventDefault();
            if (ckHo() && ckPhone() && ckEmail() && ckTin()) {
                alert("Cảm ơn bạn đã hồi đáp !");
                document.getElementById("ho").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("email").value = "";
                document.getElementById("tinnhan").value = "";
            }
        });
    </script>
</body>

</html>
